<!doctype html>
<html lang="en-AU" data-app="standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wordsprout">
<meta name="theme-color" content="#EDF0F4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Wordsprout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a fixed app shell. Sentence strip on top (Who · Doing · What),
   one big picture grid in the middle, quick words along the bottom.
   Tile colours follow the modified Fitzgerald Key used in AAC:
   people yellow, actions green, things orange, describing/feelings blue, social pink. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#18202D; --muted:#5A6476; --line:#D3D9E2;
  --accent:#0F6B6B; --accent-ink:#FFFFFF; --on-colour:#141A24; --scrim:rgba(12,16,24,.48);
  --who:#E2AE00; --who-t:#FFF3BF;
  --do:#2F9E44;  --do-t:#DDF4E1;
  --thing:#E8730C; --thing-t:#FFE6CC;
  --feel:#1F74D1; --feel-t:#DCEAFE;
  --social:#D6408A; --social-t:#FFE0EF;
  --danger:#C62A2A;
  --shadow:0 1px 0 rgba(24,32,45,.07),0 3px 8px rgba(24,32,45,.06);
  --f-word:"Andika","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --tile:132px; --tile-col:108px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151D; --surface:#1A212C; --ink:#EEF2F7; --muted:#A3ADBD; --line:#2C3644;
    --accent:#3DBDB8; --accent-ink:#06231F; --scrim:rgba(0,0,0,.6);
    --who:#F2C230; --who-t:#3A3112; --do:#4CC463; --do-t:#15301C;
    --thing:#FF9A3D; --thing-t:#3A2513; --feel:#5AA2F5; --feel-t:#142944;
    --social:#F26FAE; --social-t:#3B1A2B; --danger:#FF6B6B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#1A212C; --ink:#EEF2F7; --muted:#A3ADBD; --line:#2C3644;
  --accent:#3DBDB8; --accent-ink:#06231F; --scrim:rgba(0,0,0,.6);
  --who:#F2C230; --who-t:#3A3112; --do:#4CC463; --do-t:#15301C;
  --thing:#FF9A3D; --thing-t:#3A2513; --feel:#5AA2F5; --feel-t:#142944;
  --social:#F26FAE; --social-t:#3B1A2B; --danger:#FF6B6B; --shadow:none;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;touch-action:manipulation;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.k-who{--c:var(--who);--t:var(--who-t)}
.k-do{--c:var(--do);--t:var(--do-t)}
.k-thing{--c:var(--thing);--t:var(--thing-t)}
.k-feel{--c:var(--feel);--t:var(--feel-t)}
.k-social{--c:var(--social);--t:var(--social-t)}

.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* Sentence strip */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;padding-block:12px 10px}
.strip{flex:1 1 440px;display:flex;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px}
.slot{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:76px;padding:6px 10px;
  border-radius:15px;border:3px dashed var(--c);background:transparent;color:var(--muted)}
.slot.filled{border-style:solid;background:var(--t);color:var(--ink);justify-content:flex-start}
.slot.current{box-shadow:0 0 0 3px var(--surface),0 0 0 7px var(--c);animation:pulse 1.6s ease-in-out infinite}
.slot.skipped{opacity:.45}
.slot .emo{font-family:var(--f-emo);font-size:38px;line-height:1;flex:0 0 auto}
.slot img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.slot .w{font-family:var(--f-word);font-weight:700;font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.slot .ph{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--surface),0 0 0 11px var(--c)}}

.actions{display:flex;gap:8px;margin-left:auto}
.speak{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:108px;padding:6px 14px;
  border-radius:22px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px}
.speak .ic{font-family:var(--f-emo);font-size:32px;line-height:1}
.speak.talking{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.05)}}
.ctl{width:74px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:30px;line-height:1;display:grid;place-items:center}
.ctl small{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-top:4px}
.gear{position:relative;overflow:hidden}
.gear::after{content:"";position:absolute;inset:0;background:var(--accent);opacity:.28;transform:scaleY(0);transform-origin:bottom}
.gear.holding::after{animation:fillup 1.4s linear forwards}
@keyframes fillup{to{transform:scaleY(1)}}

/* Talk / Answer switch */
.modesw{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.modesw button{flex:1;display:flex;align-items:center;gap:8px;padding:6px 16px 6px 12px;border-radius:16px;border:2px solid var(--line);
  background:var(--surface);color:var(--muted);font-weight:700;font-size:18px}
.modesw .emo{font-family:var(--f-emo);font-size:24px;line-height:1}
.modesw button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.app.answer .talk-only{display:none}
.app.answer .strip{overflow-x:auto}
.slot.ans{flex:1 0 86px;flex-direction:column;justify-content:center;gap:3px;padding:4px 6px}
.slot.ans .emo{font-size:32px}
.slot.ans .w{font-size:18px;max-width:100%}
.slot[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:-1px}
.slot.add{--c:var(--muted)}

/* Edit banner */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px 10px 16px;margin-bottom:8px;border-radius:16px;
  background:var(--ink);color:var(--bg);font-size:16px;line-height:1.35}
.banner span{flex:1 1 260px;min-width:0}
.banner button{padding:10px 18px;border-radius:12px;border:0;background:var(--bg);color:var(--ink);font-weight:700;font-size:17px}

/* Step heading */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:2px 10px;min-height:58px}
.ask{display:flex;align-items:center;gap:10px;font:700 28px/1 var(--f-word);color:var(--ink);flex:0 0 auto}
.dot{width:20px;height:20px;border-radius:7px;background:var(--c);flex:0 0 auto}
.tabs{display:flex;gap:8px;overflow-x:auto;flex:1 1 300px;min-width:0;padding:4px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 16px 8px 12px;border-radius:999px;border:2px solid var(--c);
  background:var(--surface);color:var(--ink);font:700 19px/1.1 var(--f-word)}
.tab .emo{font-family:var(--f-emo);font-size:24px;line-height:1}
.tab.on{background:var(--c);color:var(--on-colour)}
.tab-add{--c:var(--line);border-style:dashed;color:var(--muted)}
.pill{padding:12px 20px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:18px}
.pill.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.head .pill{margin-left:auto}

/* Board */
.board{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:12px;padding:8px;align-content:start}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;
  min-height:calc(var(--tile) * 1.06);padding:8px 6px 10px;border-radius:18px;border:3px solid var(--c);background:var(--t);
  color:var(--ink);box-shadow:var(--shadow);transition:transform .08s ease}
.tile:active{transform:scale(.94)}
.tile[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.tile .pic{height:calc(var(--tile) * .64);width:100%;display:grid;place-items:center}
.tile .emo{font-family:var(--f-emo);font-size:calc(var(--tile) * .44);line-height:1}
.tile img{width:calc(var(--tile) * .62);height:calc(var(--tile) * .62);max-width:100%;object-fit:cover;border-radius:12px;display:block}
.tile .word{font-family:var(--f-word);font-weight:700;font-size:max(16px,calc(var(--tile) * .155));line-height:1.08;text-align:center;
  overflow-wrap:anywhere;text-wrap:balance;max-width:100%}
.tile.add{--c:var(--muted);--t:transparent;border-style:dashed;box-shadow:none;color:var(--muted)}
.pen{position:absolute;top:-9px;right:-9px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-size:17px;font-family:var(--f-ui)}
.empty{padding:28px 12px;color:var(--muted);font-size:18px;max-width:46ch}

/* All columns */
.cols{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px;height:100%;overflow-x:auto}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 8px 4px}
.col h2{display:flex;align-items:center;gap:10px;margin:0 8px 4px;font:700 24px/1.1 var(--f-word)}
.col .tabs{flex:0 0 auto;padding-inline:6px}
.col .grid{--tile:var(--tile-col);overflow-y:auto;flex:1;min-height:0}
.col .mini{align-self:flex-start;margin:2px 8px}

/* Finished sentence */
.done{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:16px 0;text-align:center}
.done .row{--tile:clamp(118px,21vw,200px);display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.done .row .tile{width:calc(var(--tile) * 1.05);animation:pop .38s cubic-bezier(.2,1.4,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.said{margin:0;font:700 clamp(30px,4.6vw,52px)/1.15 var(--f-word);text-wrap:balance;max-width:24ch}
.big-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bb{padding:18px 28px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:22px}
.bb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Quick words */
.quick{display:flex;gap:10px;overflow-x:auto;padding-block:10px 12px;border-top:1px solid var(--line);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .tile{--tile:82px;flex:0 0 96px;min-height:94px;padding:6px 4px 8px}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(640px,100%);margin-block:auto;background:var(--surface);color:var(--ink);border-radius:24px;padding:22px;
  font-size:17px;line-height:1.4;-webkit-user-select:text;user-select:text}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-head h2{margin:0;flex:1;font:700 26px/1.15 var(--f-word);text-wrap:balance}
.x{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:22px}
fieldset{border:0;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px}
legend{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:14px}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
.opt b{display:block}
.opt small{display:block;color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field small{font-weight:400;color:var(--muted)}
.field input[type=text],.field select{font:18px var(--f-ui);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.inline{display:flex;gap:8px}
.inline button{flex:0 0 auto;width:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:22px}
.seg{display:flex;gap:8px}
.seg label{flex:1;text-align:center;padding:12px 8px;border:2px solid var(--line);border-radius:12px;font-weight:700}
.seg label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.seg input{position:absolute;opacity:0;pointer-events:none}
.tog{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0}
.tog input{width:24px;height:24px;accent-color:var(--accent);flex:0 0 auto}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.ghost-danger{color:var(--danger);background:transparent}
.btn.wide{width:100%;padding:16px;font-size:19px}
.note{color:var(--muted);font-size:15px;margin:0}
.warn{font-weight:700;color:var(--danger)}
.ed{display:flex;gap:18px;flex-wrap:wrap}
.ed-prev{--tile:150px;flex:0 0 auto}
.picmode{display:flex;gap:8px;flex-wrap:wrap}
.picmode button{flex:1 1 0;min-width:90px;padding:10px 8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px}
.picmode button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.facegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ed-prev .tile{width:160px;pointer-events:none}
.ed-fields{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:14px}
.sh-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.sh-foot .sp{flex:1}
.mini{padding:8px 14px;border-radius:999px;border:2px dashed var(--muted);background:transparent;font-weight:700;font-size:16px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 116px);transform:translateX(-50%);z-index:60;
  max-width:min(520px,calc(100% - 32px));padding:14px 20px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:17px;text-align:center}

/* Small or short screens (phones, either way round): the whole page scrolls */
@media (max-width:720px), (max-height:620px){
  body{height:auto;min-height:100%;overflow:auto}
  .app{height:auto;min-height:100%;grid-template-rows:auto}
  .board{overflow:visible!important}
  .cols{height:auto}
  .col .grid{overflow:visible}
  .quick{position:sticky;bottom:0;z-index:5;background:var(--bg);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
/* Phone width */
@media (max-width:720px){
  .top{gap:8px;padding-block:8px}
  .modesw{flex:1 1 100%;flex-direction:row}
  .modesw button{justify-content:center;min-height:46px;font-size:17px;padding:4px 10px}
  .strip{flex:1 1 100%;padding:6px;gap:6px}
  .slot{height:62px;flex-direction:column;justify-content:center;gap:1px;padding:3px 4px}
  .slot.filled{justify-content:center}
  .slot .emo{font-size:26px} .slot img{width:34px;height:34px;border-radius:8px}
  .slot .w{font-size:15px;max-width:100%}
  .slot .ph{font-size:13px}
  .slot.ans{flex:1 0 62px}
  .slot.ans .emo{font-size:24px} .slot.ans .w{font-size:13px}
  .actions{flex:1 1 100%}
  .speak{flex:1;flex-direction:row;gap:10px;min-height:52px;white-space:nowrap}
  .speak .ic{font-size:26px}
  .ctl{width:58px;font-size:24px}
  .banner{font-size:14px;padding:8px 8px 8px 12px;gap:8px}
  .banner span{flex-basis:180px}
  .banner button{padding:8px 12px;font-size:15px}
  .head{min-height:0;padding-block:0 6px;gap:8px}
  .ask{font-size:22px}
  .tab{font-size:16px;padding:6px 12px 6px 8px} .tab .emo{font-size:20px}
  .grid{gap:10px;padding:6px}
  .quick{gap:8px;padding-top:8px}
  .quick .tile{--tile:68px;flex-basis:80px;min-height:82px}
  .done{gap:18px}
  .done .row{--tile:clamp(92px,27vw,150px);gap:12px}
  .said{font-size:28px}
  .bb{padding:14px 20px;font-size:19px}
  .sheet{padding:16px;border-radius:18px}
  .sh-head h2{font-size:22px}
  .ed-prev{--tile:104px} .ed-prev .tile{width:116px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="modesw" role="group" aria-label="Talk or answer">
      <button data-act="mode" data-m="talk" aria-pressed="true"><span class="emo" aria-hidden="true">💬</span>Talk</button>
      <button data-act="mode" data-m="answer" aria-pressed="false"><span class="emo" aria-hidden="true">🙋‍♀️</span>Answer</button>
    </div>
    <div class="strip" id="strip"></div>
    <div class="actions">
      <button class="speak" id="speakBtn" data-act="speak"><span class="ic" aria-hidden="true">🔊</span><span id="speakLbl">Say it</span></button>
      <button class="ctl talk-only" data-act="back" aria-label="Remove last word"><span>⌫</span></button>
      <button class="ctl talk-only" data-act="clear" aria-label="Clear sentence"><span>✕</span></button>
      <button class="ctl gear" id="gear" aria-label="Grown-up settings. Press and hold.">⚙︎</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="head" id="head"></div>
  <main class="board" id="board"></main>
  <nav class="quick" id="quick" aria-label="Quick words"></nav>
</div>

<div class="sheet-wrap" id="sheet" hidden><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const T = (label, emoji, say, extra) => Object.assign({ id: uid(), label, emoji, say: say || "" }, extra || {});

/* ---------- Cartoon faces ---------- */

const store = {

  },
  async get(k) {

  async set(k, v) {

      const db = await this.open();

/* ---------- Speech ---------- */
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voices = [];
function loadVoices() {

    const en = all.filter(v => /^en/i.test(v.lang));
    voices = (en.length ? en : all).slice().sort((a, b) => rankVoice(a) - rankVoice(b) || a.name.localeCompare(b.name));
  } catch (e) { voices = []; }
  if (sheetKind === "settings") fillVoices();
}
function rankVoice(v) { return v.lang === "en-AU" ? 0 : /en-GB/.test(v.lang) ? 1 : /en-US/.test(v.lang) ? 2 : 3; }

function say(text) {

  const go = () => {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-AU";
    u.rate = S().rate; u.pitch = S().pitch;
    u.onstart = () => speakBtn.classList.add("talking");
    u.onend = u.onerror = () => speakBtn.classList.remove("talking");

}

/* ---------- Sentence ---------- */
function isThird(p) { return !["i", "you", "we", "they", "me"].includes(sayOf(p).trim().toLowerCase()); }

  const m = phrase.match(/^(\S+)(.*)$/); if (!m) return phrase;
  let w = m[1]; const rest = m[2]; const lw = w.toLowerCase().replace("’", "'");
  const map = { "don't": "doesn't", "do": "does", "have": "has", "go": "goes", "am": "is", "are": "is", "be": "is" };
  const keep = ["can", "can't", "cannot", "will", "won't", "would", "could", "should", "must", "may", "might", "doesn't", "is", "was", "has", "does"];
  if (map[lw]) w = map[lw];
  else if (keep.includes(lw) || (/s$/.test(lw) && !/ss$/.test(lw))) { /* already fine */ }
  else if (/^[a-z]+$/.test(lw)) w = /(s|sh|ch|x|z|o)$/.test(lw) ? w + "es" : /[^aeiou]y$/.test(lw) ? w.slice(0, -1) + "ies" : w + "s";

}

  if (what) parts.push(sayOf(what));

}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function firstOpen() { for (let i = 0; i < 3; i++) if (!st.slots[i] && !st.skip[i]) return i; return -1; }

function pick(step, src, id) {
  const item = getItem(src, id); if (!item) return;
  st.slots[step] = { src, id }; st.skip[step] = false;
  if (step === 1 && item.go && groupById(item.go)) st.group = item.go;

    const full = st.slots.every(Boolean);
    st.done = full;

  }

}
function answer(src, id) {
  const it = getItem(src, id); if (!it) return;
  let text = sayOf(it);

    const t = curTab();
    if (t) {
      const linked = t.from && groupById(t.from);
      const word = linked ? it.label : sayOf(it);

}

}

    </div>
  </div>
  ${d.id ? `<div class="btn-row" style="margin-top:16px"><button class="btn" data-act="move-tile" data-dir="-1">◀ Move earlier</button><button class="btn" data-act="move-tile" data-dir="1">Move later ▶</button></div>` : ""}
  <div class="sh-foot">
    ${d.id ? (d.confirmDel
      ? `<span class="warn">Delete “${esc(d.label)}”?</span><button class="btn danger" data-act="del-tile-yes">Yes, delete</button><button class="btn" data-act="del-tile-no">Keep</button>`
      : `<button class="btn ghost-danger" data-act="del-tile">Delete</button>`) : ""}
    <span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-tile">Save</button>
  </div>`;
}
function draftPicHTML() {
  const d = draft;
  if (d.pic === "photo" && d.photoData) return `<img src="${d.photoData}" alt="">`;
  if (d.pic === "face") return `<img src="${faceURL(d.face, d.age === "child")}" alt="">`;
  if (d.pic === "photo") return `<span class="emo">📷</span>`;
  return `<span class="emo" id="pv-emo">${esc(d.emoji || "⭐")}</span>`;
}
function openTile(src, id) {
  const it = id ? getItem(src, id) : null;
  draft = {
    pic: it && it.photo ? "photo" : it && it.face ? "face" : "emoji",
    face: Object.assign(F("short", "brown", "brown"), (it && it.face) || {}),
    age: it ? it.age || "" : (src === "who" ? "adult" : ""),
    aud: it ? it.aud || "" : "", src, id: it ? it.id : null, label: it ? it.label : "", say: it ? it.say || "" : "", emoji: it ? it.emoji || "⭐" : "⭐",
    photo: it ? it.photo || null : null, photoData: it && it.photo ? board.photos[it.photo] || null : null, go: it ? it.go || "" : "", confirmDel: false };
  openSheet("tile", tileSheetHTML());
}
function rerenderTileSheet() { const y = sheetBody.scrollTop; sheetBody.innerHTML = tileSheetHTML(); sheetBody.scrollTop = y; }
function saveTile() {
  const d = draft; const label = d.label.trim();
  if (!label) { toast("Type the word that goes on the picture."); return; }
  const list = listFor(d.src); if (!list) return closeSheet();
  let pid = null;
  if (d.photoData) {
    if (d.photo && board.photos[d.photo] === d.photoData) pid = d.photo;
    else { pid = uid(); board.photos[pid] = d.photoData; }
  }
  if (d.pic === "photo" && !pid) { toast("Take or choose a photo first, or pick Cartoon or Emoji."); return; }
  if (d.pic !== "photo") pid = null;
  const fields = { label, say: d.say.trim(), emoji: d.emoji.trim() || "⭐", photo: pid, face: d.pic === "face" ? Object.assign({}, d.face) : null };
  if (d.src === "who") fields.age = d.age;
  if (d.src === "doing" || groupById(d.src)) fields.aud = d.aud;
  if (d.src === "doing") fields.go = d.go;
  if (d.id) Object.assign(list.find(i => i.id === d.id), fields);
  else list.push(Object.assign({ id: uid() }, fields));
  gcPhotos(); save(); closeSheet(); render();
}
function deleteTile() {
  const d = draft, list = listFor(d.src); const i = list.findIndex(x => x.id === d.id);
  if (i > -1) list.splice(i, 1);
  st.slots = st.slots.map(s => (s && s.id === d.id ? null : s));
  if (!st.slots.some(Boolean)) resetSentence();
  gcPhotos(); save(); closeSheet(); render();
}
function moveTile(dir) {
  const list = listFor(draft.src); const i = list.findIndex(x => x.id === draft.id); const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  save(); render(); toast(dir < 0 ? "Moved earlier" : "Moved later");
}

function groupSheetHTML() {
  const g = gdraft;
  if (g.isTab) return tabSheetHTML();
  const kinds = [["thing", "Things (orange)"], ["feel", "Feelings and describing (blue)"], ["who", "People (yellow)"], ["social", "Social words (pink)"]];
  return `<div class="sh-head"><h2>${g.id ? "Edit group" : "New group"}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="ed-fields">
    <label class="field">Group name<input type="text" id="g-label" value="${esc(g.label)}" autocomplete="off"></label>
    <label class="field">Emoji<input type="text" id="g-emoji" value="${esc(g.emoji)}" maxlength="16" autocomplete="off"></label>
    <fieldset style="margin:0"><legend>Colour</legend>${kinds.map(([v, t]) => `<label class="opt k-${v}"><input type="radio" name="gkind" value="${v}" ${g.kind === v ? "checked" : ""}><span class="dot"></span><span><b>${t}</b></span></label>`).join("")}</fieldset>
    ${g.mirror ? `<p class="note">This group always shows the people from the Who page.</p>` : ""}
  </div>
  ${g.id ? `<div class="btn-row" style="margin-top:16px"><button class="btn" data-act="move-group" data-dir="-1">◀ Move earlier</button><button class="btn" data-act="move-group" data-dir="1">Move later ▶</button></div>` : ""}
  <div class="sh-foot">
    ${g.id ? (g.confirmDel
      ? `<span class="warn">Delete “${esc(g.label)}” and its pictures?</span><button class="btn danger" data-act="del-group-yes">Yes, delete</button><button class="btn" data-act="del-group-no">Keep</button>`
      : `<button class="btn ghost-danger" data-act="del-group">Delete group</button>`) : ""}
    <span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-group">Save</button>
  </div>`;
}
function tabSheetHTML() {
  const g = gdraft;
  const kinds = [["feel", "Blue"], ["thing", "Orange"], ["who", "Yellow"], ["social", "Pink"], ["do", "Green"]];
  return `<div class="sh-head"><h2>${g.id ? "Edit question" : "New question"}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="ed-fields">
    <label class="field">Question <small>Shown on the tab, e.g. “What did you eat?”</small><input type="text" id="g-label" value="${esc(g.label)}" autocomplete="off"></label>
    <label class="field">Emoji<input type="text" id="g-emoji" value="${esc(g.emoji)}" maxlength="16" autocomplete="off"></label>
    <label class="field">Start each answer with <small>Optional, e.g. “I feel” or “I ate”</small><input type="text" id="g-prefix" value="${esc(g.prefix)}" autocomplete="off" autocapitalize="off"></label>
    <label class="field">Pictures<select id="g-from"><option value="">Its own pictures</option>${board.groups.map(x => `<option value="${esc(x.id)}" ${g.from === x.id ? "selected" : ""}>Same as ${esc(x.emoji)} ${esc(x.label)} on the Talk side</option>`).join("")}</select></label>
    <div class="field">Colour<div class="seg">${kinds.map(([v, t]) => `<label class="k-${v}"><input type="radio" name="gkind" value="${v}" ${g.kind === v ? "checked" : ""}><span class="dot" style="display:inline-block;vertical-align:-3px;margin-right:6px"></span>${t}</label>`).join("")}</div></div>
  </div>
  ${g.id ? `<div class="btn-row" style="margin-top:16px"><button class="btn" data-act="move-group" data-dir="-1">◀ Move earlier</button><button class="btn" data-act="move-group" data-dir="1">Move later ▶</button></div>` : ""}
  <div class="sh-foot">
    ${g.id ? (g.confirmDel
      ? `<span class="warn">Delete the “${esc(g.label)}” page?</span><button class="btn danger" data-act="del-group-yes">Yes, delete</button><button class="btn" data-act="del-group-no">Keep</button>`
      : `<button class="btn ghost-danger" data-act="del-group">Delete question</button>`) : ""}
    <span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-group">Save</button>
  </div>`;
}
function openTab(id) {
  const t = id ? tabById(id) : null;
  gdraft = { isTab: true, id: t ? t.id : null, label: t ? t.label : "", emoji: t ? t.emoji : "❓", kind: t ? t.kind : "feel", prefix: t ? t.prefix : "", from: t ? t.from : "", confirmDel: false };
  openSheet("group", groupSheetHTML());
}
function openGroup(id) {
  const g = id ? groupById(id) : null;
  gdraft = { id: g ? g.id : null, label: g ? g.label : "", emoji: g ? g.emoji : "⭐", kind: g ? g.kind : "thing", mirror: !!(g && g.mirror), confirmDel: false };
  openSheet("group", groupSheetHTML());
}
function saveGroup() {
  const g = gdraft; const label = g.label.trim();
  if (!label) { toast(g.isTab ? "Type the question." : "Give the group a name."); return; }
  if (g.isTab) {
    const f = { label, emoji: g.emoji.trim() || "❓", kind: g.kind, prefix: g.prefix.trim(), from: g.from };
    if (g.id) Object.assign(tabById(g.id), f);
    else { const id = "a-" + uid(); board.answers.tabs.push(Object.assign({ id, items: [] }, f)); st.atab = id; }
    save(); closeSheet(); render(); return;
  }
  if (g.id) Object.assign(groupById(g.id), { label, emoji: g.emoji.trim() || "⭐", kind: g.kind });
  else { const id = uid(); board.groups.push({ id, label, emoji: g.emoji.trim() || "⭐", kind: g.kind, items: [] }); st.group = id; }
  save(); closeSheet(); render();
}
function deleteGroup() {
  if (gdraft.isTab) {
    const k = board.answers.tabs.findIndex(x => x.id === gdraft.id);
    if (k > -1) board.answers.tabs.splice(k, 1);
    gcPhotos(); save(); closeSheet(); render(); return;
  }
  board.answers.tabs.forEach(t => { if (t.from === gdraft.id) t.from = ""; });
  const i = board.groups.findIndex(x => x.id === gdraft.id);
  if (i > -1) board.groups.splice(i, 1);
  board.doing.forEach(d => { if (d.go === gdraft.id) d.go = ""; });
  st.slots = st.slots.map(s => (s && s.src === gdraft.id ? null : s));
  gcPhotos(); save(); closeSheet(); render();
}
function moveGroup(dir) {
  const l = gdraft.isTab ? board.answers.tabs : board.groups, i = l.findIndex(x => x.id === gdraft.id), j = i + dir;
  if (i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]]; save(); render(); toast(dir < 0 ? "Moved earlier" : "Moved later");
}

/* Sheet inputs */
sheetBody.addEventListener("input", e => {
  const t = e.target;
  if (sheetKind === "tile" && draft) {
    if (t.id === "f-label") { draft.label = t.value; const w = $("#pv-word"); if (w) w.textContent = t.value || "word"; }
    if (t.id === "f-say") draft.say = t.value;
    if (t.id === "f-emoji") { draft.emoji = t.value; const em = $("#pv-emo"); if (em) em.textContent = t.value || "⭐"; }
  } else if (sheetKind === "group" && gdraft) {
    if (t.id === "g-label") gdraft.label = t.value;
    if (t.id === "g-emoji") gdraft.emoji = t.value;
    if (t.id === "g-prefix") gdraft.prefix = t.value;
  } else if (sheetKind === "settings") {
    if (t.id === "rate") { S().rate = parseFloat(t.value); $("#rateVal").textContent = S().rate.toFixed(2) + "×"; save(); }
    if (t.id === "pitch") { S().pitch = parseFloat(t.value); $("#pitchVal").textContent = S().pitch.toFixed(2); save(); }
  }
});
sheetBody.addEventListener("change", e => {
  const t = e.target;
  if (sheetKind === "tile" && draft) {
    if (t.id === "f-go") draft.go = t.value;
    if (t.id === "f-age") { draft.age = t.value; $("#pv-pic").innerHTML = draftPicHTML(); }
    if (t.id === "f-aud") draft.aud = t.value;
    const fk = { "fc-style": "style", "fc-hair": "hair", "fc-eyes": "eyes", "fc-skin": "skin", "fc-shirt": "shirt" }[t.id];
    if (fk) draft.face[fk] = t.value;
    if (t.id === "fc-glasses") draft.face.glasses = t.checked;
    if (fk || t.id === "fc-glasses") $("#pv-pic").innerHTML = draftPicHTML();
  }
  if (sheetKind === "group" && t.name === "gkind") gdraft.kind = t.value;
  if (sheetKind === "group" && t.id === "g-from") gdraft.from = t.value;
  if (sheetKind !== "settings") return;
  const s = S();
  if (t.name === "mode") { s.mode = t.value; resetSentence(); }
  else if (t.name === "size") s.size = t.value;
  else if (t.id === "voiceSel") { s.voice = t.value; say("Hello"); }
  else if (t.type === "checkbox" && t.dataset.key) s[t.dataset.key] = t.checked;
  save(); render();
});

$("#photoInput").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f || !draft) return;
  try { draft.photoData = await fileToPhoto(f); draft.pic = "photo"; rerenderTileSheet(); }
  catch (err) { toast("That picture couldn't be opened. Try a different photo."); }
});
$("#importInput").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const b = JSON.parse(await f.text());
    if (!valid(b)) throw new Error("not a board");
    clearPhotoCache(); board = migrate(b); resetSentence(); save(); closeSheet(); render(); toast("Backup loaded.");
  } catch (err) { toast("That file isn't a Wordsprout backup."); }
});
function exportBoard() {
  if (window.self !== window.top) { toast("Backups can be saved when the board is opened from its own web address, like your GitHub Pages link."); return; }
  try {
    const blob = new Blob([JSON.stringify(board)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `wordsprout-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast("Backup file downloaded.");
  } catch (err) { toast("Saving a file isn't allowed in this browser."); }
}

/* ---------- Taps ---------- */
const acts = {
  pick(b) {
    if (st.edit) { const src = b.dataset.src; const g = groupById(src); openTile(g && g.mirror ? "who" : src, b.dataset.id); return; }
    pick(+b.dataset.step, b.dataset.src, b.dataset.id);
  },
  add(b) { openTile(b.dataset.src, null); },
  quick(b) {
    if (st.edit) { openTile("quick", b.dataset.id); return; }
    const it = getItem("quick", b.dataset.id); if (it) say(sayOf(it));
  },
  slot(b) {
    if (!guided()) return;
    const i = +b.dataset.i, open = firstOpen();
    if (st.edit || st.slots[i] || st.skip[i] || open === -1 || i <= open) { st.step = i; st.done = false; render(); }
  },
  tab(b) { st.group = b.dataset.id; render(); },
  atab(b) { st.atab = b.dataset.id; st.last = null; render(); },
  mode(b) { st.mode = b.dataset.m; st.last = null; render(); },
  answer(b) {
    if (st.edit) { const src = b.dataset.src; const g = groupById(src); openTile(g && g.mirror ? "who" : src, b.dataset.id); return; }
    answer(b.dataset.src, b.dataset.id);
  },
  skip() { skipStep(); },
  speak() {
    if (st.mode === "answer") { if (st.last) say(st.last.text); else toast("Tap an answer first."); return; }
    const s = sentence(); if (s) say(s); else toast("Tap the pictures to make a sentence."); },
  again() { say(sentence()); },
  back() { back(); },
  clear() { resetSentence(); render(); },
  "done-edit"() { st.edit = false; render(); },
  "edit-group"() { if (st.mode === "answer") { if (curTab()) openTab(curTab().id); } else if (curGroup()) openGroup(curGroup().id); },
  "add-group"() { if (st.mode === "answer") openTab(null); else openGroup(null); },
  close() { closeSheet(); },
  "edit-mode"() { st.edit = true; st.done = false; if (firstOpen() === -1) st.step = 0; closeSheet(); render(); },
  "test-voice"() { say("I want juice"); },
  export() { exportBoard(); },
  import() { $("#importInput").click(); },
  reset() { confirmReset = true; sheetBody.innerHTML = settingsHTML(); fillVoices(); },
  "reset-no"() { confirmReset = false; sheetBody.innerHTML = settingsHTML(); fillVoices(); },
  "reset-yes"() { const s = S(); clearPhotoCache(); board = defaults(); board.settings = s; resetSentence(); save(); closeSheet(); render(); toast("Starting board restored."); },
  photo() { $("#photoInput").click(); },
  nophoto() { draft.photoData = null; rerenderTileSheet(); },
  picmode(b) { draft.pic = b.dataset.m; rerenderTileSheet(); },
  "test-say"() { if (draft) say(draft.say.trim() || draft.label.trim()); },
  "save-tile"() { saveTile(); },
  "del-tile"() { draft.confirmDel = true; rerenderTileSheet(); },
  "del-tile-no"() { draft.confirmDel = false; rerenderTileSheet(); },
  "del-tile-yes"() { deleteTile(); },
  "move-tile"(b) { moveTile(+b.dataset.dir); },
  "save-group"() { saveGroup(); },
  "del-group"() { gdraft.confirmDel = true; sheetBody.innerHTML = groupSheetHTML(); },
  "del-group-no"() { gdraft.confirmDel = false; sheetBody.innerHTML = groupSheetHTML(); },
  "del-group-yes"() { deleteGroup(); },
  "move-group"(b) { moveGroup(+b.dataset.dir); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const f = acts[b.dataset.act]; if (f) f(b, e);
});

/* Grown-up lock: press and hold the cog */
const gear = $("#gear"); let holdT = null, held = false;
const HOLD_MS = 1400;
function holdStart(e) {
  e.preventDefault(); held = false; gear.classList.add("holding");
  holdT = setTimeout(() => { held = true; gear.classList.remove("holding"); openSettings(); }, HOLD_MS);
}
function holdEnd() {
  if (holdT) { clearTimeout(holdT); holdT = null; }
  if (gear.classList.contains("holding") && !held) toast("Grown-ups: press and hold ⚙︎ to open settings.");
  gear.classList.remove("holding");
}
gear.addEventListener("pointerdown", holdStart);
gear.addEventListener("pointerup", holdEnd);
gear.addEventListener("pointercancel", () => { clearTimeout(holdT); gear.classList.remove("holding"); });
gear.addEventListener("pointerleave", () => { clearTimeout(holdT); gear.classList.remove("holding"); });
gear.addEventListener("contextmenu", e => e.preventDefault());
gear.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSettings(); } });

let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(render, 150); });

/* ---------- Start ---------- */
render();
if (synth) { loadVoices(); try { synth.addEventListener("voiceschanged", loadVoices); } catch (e) { synth.onvoiceschanged = loadVoices; } }
store.get("board").then(saved => {
  if (valid(saved)) { board = migrate(saved); render(); if (migrated) { save(); toast("Updated: the new family list is on the Who page."); } }
}).catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator && window.self === window.top && location.protocol === "https:" && document.documentElement.dataset.app === "standalone") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>

</body>
</html>
